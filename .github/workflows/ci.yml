name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Offline regression suite (network denied)
        run: python tools/test_offline.py
      - name: First-run product smoke
        run: |
          regular --version
          regular demo 查好感 掷骰子
          regular --directory "$RUNNER_TEMP/regular-instance" init
          regular --directory "$RUNNER_TEMP/regular-instance" doctor --json > "$RUNNER_TEMP/doctor.json" || test "$?" -eq 1
          python -c 'import json, os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/doctor.json")); assert d["network"] is False; assert any(x["check"] == "configuration" and x["state"] == "error" for x in d["checks"])'
      - run: python -m build
      - name: Installed wheel smoke from outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          regular --version
          regular demo 查好感 掷骰子
