<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">The Regular · Routing, state and generated language</title><desc id="desc">The Regular · Routing, state and generated language. Repository-specific technical illustration.</desc>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="1" y="1" width="1198" height="698" rx="20" fill="#F8FAFD" stroke="#DBE3ED" />
<text x="36" y="45" font-size="25" fill="#23324A" font-weight="700" text-anchor="start">A message does not have to become a model call.</text>
<rect x="36" y="104" width="260" height="130" rx="14" fill="#EAF1FE" stroke="#9CB4DF" />
<text x="54" y="136" font-size="20" fill="#23324A" font-weight="700" text-anchor="start">QQ event</text>
<text x="54" y="166" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Group / C2C identity</text>
<text x="54" y="190" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Normalized text + mentions</text>
<rect x="430" y="104" width="330" height="130" rx="14" fill="#E7F5EF" stroke="#93C8B0" />
<text x="448" y="136" font-size="20" fill="#23324A" font-weight="700" text-anchor="start">Command + identity routing</text>
<text x="448" y="166" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Names, owner, modes, affinity</text>
<text x="448" y="190" font-size="16" fill="#536782" font-weight="400" text-anchor="start">State is maintained locally</text>
<rect x="900" y="104" width="264" height="130" rx="14" fill="#FFF3DD" stroke="#D9BD83" />
<text x="918" y="136" font-size="20" fill="#23324A" font-weight="700" text-anchor="start">Local command</text>
<text x="918" y="166" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Dice / ledger / lookups</text>
<text x="918" y="190" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Can finish without an LLM</text>
<path d="M296 169H430m-7 -5 7 5 -7 5" fill="none" stroke="#6E809A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M760 169H900m-7 -5 7 5 -7 5" fill="none" stroke="#6E809A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="328" width="330" height="150" rx="14" fill="#F0EAFC" stroke="#B7A2D7" />
<text x="448" y="360" font-size="20" fill="#23324A" font-weight="700" text-anchor="start">Activation + request budget</text>
<text x="448" y="390" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Reply / remain quiet</text>
<text x="448" y="414" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Layered context → provider</text>
<text x="448" y="438" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Generated language + checks</text>
<path d="M595 234V328m-5 -7 5 7 5 -7" fill="none" stroke="#6E809A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="611" y="289" font-size="15" fill="#6C6487" font-weight="400" text-anchor="start">Chat path</text>
<rect x="36" y="328" width="260" height="150" rx="14" fill="#F0F3F8" stroke="#BCC9D8" />
<text x="54" y="360" font-size="20" fill="#23324A" font-weight="700" text-anchor="start">Local archive + digest</text>
<text x="54" y="390" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Raw messages on disk</text>
<text x="54" y="414" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Previous digest + new delta</text>
<text x="54" y="438" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Refresh stable memory</text>
<path d="M166 234V328m-5 -7 5 7 5 -7" fill="none" stroke="#6E809A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="181" y="289" font-size="15" fill="#61738C" font-weight="400" text-anchor="start">Archive</text>
<path d="M296 402H430m-7 -5 7 5 -7 5" fill="none" stroke="#8A7BB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<text x="315" y="382" font-size="14" fill="#756889" font-weight="400" text-anchor="start">Context</text>
<rect x="900" y="328" width="264" height="150" rx="14" fill="#E7F5EF" stroke="#93C8B0" />
<text x="918" y="360" font-size="20" fill="#23324A" font-weight="700" text-anchor="start">Delivery</text>
<text x="918" y="390" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Output checks + QQ send</text>
<text x="918" y="414" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Record the interaction</text>
<text x="918" y="438" font-size="16" fill="#536782" font-weight="400" text-anchor="start">Connection retry path</text>
<path d="M760 402H900m-7 -5 7 5 -7 5" fill="none" stroke="#6E809A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1032 234V328m-5 -7 5 7 5 -7" fill="none" stroke="#6E809A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="36" y="548" width="1128" height="100" rx="14" fill="#FFF5E4" stroke="#E0C28F" />
<text x="57" y="580" font-size="20" fill="#715329" font-weight="700" text-anchor="start">The model can interpret sentiment; code owns the numeric update.</text>
<text x="57" y="615" font-size="16" fill="#806A4A" font-weight="400" text-anchor="start">Provider caching and fallback are measured behaviors, not universal cost or uptime guarantees.</text>
</g></svg>