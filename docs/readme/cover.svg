<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">The Regular</title><desc id="desc">The Regular. Repository-specific technical illustration.</desc>
<defs><linearGradient id="project-bg" x2="1" y2="1"><stop stop-color="#241D1C"/><stop offset="1" stop-color="#35291F"/></linearGradient><pattern id="texture" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".035"/></pattern></defs>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="1" y="1" width="1278" height="518" rx="20" fill="url(#project-bg)" stroke="#283951" />
<rect x="1" y="1" width="1278" height="518" rx="20" fill="url(#texture)"/>
<path d="M53 31h25v18H65l-8 6v-6h-4zM59 38h13M59 43h9" fill="none" stroke="#F1C383" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M0 430H1280M640 0V520" fill="none" stroke="#25354F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="49" font-size="13" fill="#F1C383" font-weight="700" text-anchor="start">A RESIDENT QQ GROUP COMPANION</text>
<text x="50" y="132" font-size="45" fill="#F7FAFF" font-weight="700" text-anchor="start">The Regular</text>
<text x="52" y="190" font-size="22" fill="#C2CFE1" font-weight="400" text-anchor="start">A familiar voice,</text>
<text x="52" y="223" font-size="22" fill="#C2CFE1" font-weight="400" text-anchor="start">with its social state held in code.</text>
<text x="52" y="350" font-size="17" fill="#8EA4BF" font-weight="400" text-anchor="start">— Activation decides when to speak.</text>
<text x="52" y="379" font-size="17" fill="#8EA4BF" font-weight="400" text-anchor="start">— Local commands avoid unnecessary calls.</text>
<text x="52" y="408" font-size="17" fill="#8EA4BF" font-weight="400" text-anchor="start">— Stable context supports provider caching.</text>
<text x="52" y="486" font-size="12" fill="#6F86A4" font-weight="700" text-anchor="start">PROJECT OVERVIEW  /  SCHEMATIC</text>
<rect x="699" y="68" width="524" height="100" rx="14" fill="#17263D" stroke="#364A66" />
<text x="717" y="99" font-size="17" fill="#F1C383" font-weight="700" text-anchor="start">CODE-OWNED SOCIAL STATE</text>
<text x="717" y="129" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">names  ·  affinity  ·  modes  ·  promise ledger</text>
<path d="M959 168V200H820V225" fill="none" stroke="#F1C383" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M959 200H1095V225" fill="none" stroke="#F1C383" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M815 218l5 7 5-7M1090 218l5 7 5-7" fill="none" stroke="#F1C383" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="699" y="225" width="242" height="142" rx="14" fill="#17263D" stroke="#364A66" />
<text x="717" y="256" font-size="17" fill="#F1C383" font-weight="700" text-anchor="start">LOCAL ROUTE</text>
<text x="717" y="286" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">Dice / lookups</text>
<text x="717" y="310" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">No model request</text>
<rect x="967" y="225" width="256" height="142" rx="14" fill="#17263D" stroke="#364A66" />
<text x="985" y="256" font-size="17" fill="#F1C383" font-weight="700" text-anchor="start">GENERATED REPLY</text>
<text x="985" y="286" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">Layered context</text>
<text x="985" y="310" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">Provider fallback</text>
<text x="699" y="411" font-size="17" fill="#D7E2F1" font-weight="400" text-anchor="start">One message can end in silence, a local command,</text>
<text x="699" y="438" font-size="17" fill="#D7E2F1" font-weight="400" text-anchor="start">or a checked model reply. The state stays in code.</text>
<text x="699" y="482" font-size="12" fill="#8FA4C0" font-weight="400" text-anchor="start">QQ EVENTS   /   LOCAL JSON STATE   /   CONFIGURABLE LLM</text>
</g></svg>