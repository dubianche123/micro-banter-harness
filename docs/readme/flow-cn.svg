<text x="57" y="580" font-size="20" fill="#715329" font-weight="700" text-anchor="start">模型可以判断情绪方向；数值如何结算，由代码决定。</text>
<text x="57" y="615" font-size="16" fill="#806A4A" font-weight="400" text-anchor="start">供应商缓存与回退有实测记录；成本和可用性依赖配置及运行条件。</text>
